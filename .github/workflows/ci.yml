name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image (build · smoke · e2e · publish)
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: renotion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name renotion -p 8080:8080 renotion:ci
          for _ in $(seq 1 30); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          curl -fs http://localhost:8080/editor | grep -q '<title>Renotion'
          test "$(docker inspect -f '{{.Config.User}}' renotion:ci)" = "101"
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' renotion)" = "healthy" ] && exit 0
            sleep 2
          done
          echo "container never became healthy" && exit 1

      - name: E2E against the container
        run: >
          docker run --rm --network host --ipc=host
          -e CI=true -e PLAYWRIGHT_BASE_URL=http://localhost:8080
          -v "$PWD:/app" -w /app
          mcr.microsoft.com/playwright:v1.65.0-noble
          sh -c "npm ci && npx playwright test"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  database:
    name: Database (Postgres · RLS · cloud e2e)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Start local Supabase (Postgres, auth, API) and apply migrations
        run: npm run db:start

      - name: Schema, functions and Row Level Security tests
        run: npm run test:db

      - name: Build the app against the local stack
        run: |
          eval "$(npx supabase status -o env)"
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" npm run build

      - name: Cloud end-to-end test (sign-up, save, privacy, share link)
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          for _ in $(seq 1 30); do curl -fs http://localhost:4173 >/dev/null && break; sleep 1; done
          E2E_CLOUD=1 PLAYWRIGHT_BASE_URL=http://localhost:4173 npx playwright test tests/e2e/cloud.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cloud-playwright-report
          path: playwright-report
          retention-days: 7
