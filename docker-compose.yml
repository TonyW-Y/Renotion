# Production image:    docker compose up --build web          → http://localhost:8080
# Dev with hot reload: docker compose --profile dev up dev    → http://localhost:5173
#   (port taken? DEV_PORT=5174 docker compose --profile dev up dev)
# E2E in containers:   docker compose --profile test up --build --exit-code-from e2e e2e

services:
  web:
    build: .
    image: renotion:local
    ports:
      - '${WEB_PORT:-8080}:8080'
    restart: unless-stopped

  dev:
    profiles: [dev]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - '${DEV_PORT:-5173}:5173'
    volumes:
      - .:/app
      # Linux node_modules live in a volume, not on the host.
      - node_modules:/app/node_modules
    environment:
      # File watching through bind mounts on macOS / Windows.
      CHOKIDAR_USEPOLLING: 'true'

  e2e:
    profiles: [test]
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    working_dir: /app
    depends_on:
      web:
        condition: service_healthy
    command: sh -c "npm ci && npx playwright test"
    environment:
      CI: 'true'
      PLAYWRIGHT_BASE_URL: http://web:8080
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules
    ipc: host

volumes:
  node_modules:
  e2e_node_modules:
